[project]
name = "blog-post-factory"
version = "0.1.0"
description = "A multi-agent system for creating blog posts."
authors = [
    {name = "Gemini", email = "gemini@google.com"},
]
requires-python = ">=3.8"
dependencies = [
    "langgraph",
    "duckduckgo-search",
    "langchain-community",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-classic==1.0.0",
    "langchain-ollama",
    "Flask",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
